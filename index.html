<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Väike Frank</title>
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Väike Frank">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fdf6ec">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js'))}</script>

<style>
:root{
  --bg1:#fdf6ec; --bg2:#eaf4f8; --ink:#4a4a68; --soft:#8a8aa6;
  --peach:#ffd8c2; --mint:#c9ecd9; --sky:#cfe5fb; --lav:#e2d7f7; --butter:#fff0b8; --rose:#fbd3df;
  --card:#ffffffee; --r:28px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
body{font-family:"Nunito","Avenir Next","Trebuchet MS",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;background:none;touch-action:manipulation}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 20px 20px}
.screen.on{display:flex}
.topbar{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:5}
.topbar>*{pointer-events:auto}
.iconbtn{width:72px;height:72px;border-radius:50%;background:var(--card);box-shadow:0 4px 14px #0001;display:flex;align-items:center;justify-content:center}
.iconbtn svg{width:38px;height:38px}
.iconbtn:active{transform:scale(.94)}

/* start */
#start .bigplay{width:220px;height:220px;border-radius:50%;background:var(--mint);box-shadow:0 10px 30px #0002;display:flex;align-items:center;justify-content:center;animation:breathe 3.5s ease-in-out infinite}
#start h1{font-size:34px;margin:34px 0 4px;font-weight:800;text-align:center}
#start p{color:var(--soft);font-size:20px;margin:0}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* home */
#home .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;width:min(1000px,94vw)}
@media (orientation:portrait){#home .tiles{grid-template-columns:1fr;width:min(460px,80vw);gap:22px}}
.tile{border-radius:36px;padding:26px 16px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 8px 24px #0000000f;transition:transform .15s}
.tile:active{transform:scale(.96)}
.tile svg{width:min(190px,22vh);height:min(190px,22vh)}
.tile span{font-size:28px;font-weight:800}
.tile.t1{background:var(--sky)} .tile.t2{background:var(--rose)} .tile.t3{background:var(--mint)}
.tile[disabled]{opacity:.45}

/* parent hold */
#lockbtn{position:relative}
#lockbtn .ring{position:absolute;inset:-6px;width:84px;height:84px;transform:rotate(-90deg)}
#lockbtn .ring circle{fill:none;stroke:#9ccfb1;stroke-width:6;stroke-linecap:round;stroke-dasharray:245;stroke-dashoffset:245}
.holdtip{position:absolute;right:0;top:84px;background:var(--card);padding:8px 14px;border-radius:14px;font-size:15px;white-space:nowrap;opacity:0;transition:opacity .2s;box-shadow:0 4px 12px #0001}
.holdtip.show{opacity:1}

/* game shared */
.stage{width:min(980px,96vw);display:flex;flex-direction:column;align-items:center;gap:4vh}
.card{background:var(--card);border-radius:36px;box-shadow:0 8px 28px #0000000f;position:relative}
.progress{display:flex;gap:10px;position:absolute;top:38px;left:50%;transform:translateX(-50%)}
.progress i{width:14px;height:14px;border-radius:50%;background:#0000000f;transition:background .3s}
.progress i.done{background:#a9d8bf}
.choices{display:flex;gap:3vw;justify-content:center;flex-wrap:wrap}
.choice{width:clamp(110px,15vw,160px);height:clamp(110px,15vw,160px);border-radius:32px;background:var(--card);box-shadow:0 6px 18px #00000012;font-size:clamp(60px,9vw,92px);font-weight:800;display:flex;align-items:center;justify-content:center;transition:transform .15s,opacity .4s}
.choice:active{transform:scale(.94)}
.choice.faded{opacity:.25;pointer-events:none}
.choice.good{background:#c9ecd9}
.wobble{animation:wobble .45s}
@keyframes wobble{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.glow{animation:glow 1.1s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 #ffd36e99,0 6px 18px #00000012;transform:scale(1)}50%{box-shadow:0 0 0 18px #ffd36e00,0 6px 18px #00000012;transform:scale(1.06)}}

/* counting */
#dotcard{width:min(640px,88vw);height:min(340px,38vh);display:block}
#dotcard .dot{transition:transform .25s, filter .25s;transform-box:fill-box;transform-origin:center}
#dotcard .dot.lit{transform:scale(1.35);filter:drop-shadow(0 0 6px #ffcf5a)}
#dotcard text{font-size:34px;font-weight:800;fill:var(--ink)}

/* colours */
#colchoices{gap:2.6vw;max-width:min(980px,96vw)}
.cobj{width:clamp(120px,18vw,190px);height:clamp(140px,21vw,220px);background:none;box-shadow:none;transition:transform .15s,opacity .4s}
.cobj svg{width:100%;height:100%;overflow:visible}
.cobj.faded{opacity:.2;pointer-events:none}
.cobj.glow{animation:glow2 1.1s ease-in-out infinite}
@keyframes glow2{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.cobj.wobble{animation:wobble .45s}

/* praise */
#praise{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:20}
#praise .bub{font-size:clamp(44px,7vw,72px);font-weight:800;color:#5a9e7c;background:#fffffff2;padding:18px 40px;border-radius:40px;box-shadow:0 10px 30px #0001;opacity:0;transform:scale(.7);transition:all .35s cubic-bezier(.3,1.6,.5,1)}
#praise.show .bub{opacity:1;transform:scale(1)}
.conf{position:absolute;width:18px;height:18px;border-radius:50%;opacity:.9;animation:float 1.6s ease-out forwards}
@keyframes float{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}

/* done / rest */
.endcard{padding:46px 60px;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.endcard h2{font-size:40px;margin:0}
.endcard svg{width:200px;height:200px}
.pill{padding:20px 46px;border-radius:999px;font-size:26px;font-weight:800;background:var(--mint);box-shadow:0 6px 16px #0001}
.pill:active{transform:scale(.96)}

/* breathing */
#breathe{background:linear-gradient(180deg,#e7f0fb,#f7eef6 60%,#fdf3e7)}
#bwrap{position:relative;width:min(560px,80vw);height:min(560px,62vh);display:flex;align-items:center;justify-content:center}
#bobj{width:100%;height:100%;transform:scale(.5);transition-property:transform;transition-timing-function:ease-in-out}
#bword{font-size:clamp(34px,5vw,50px);font-weight:800;min-height:60px;color:#6b6b90;transition:opacity .4s}
#bdots{display:flex;gap:12px}
#bdots i{width:16px;height:16px;border-radius:50%;background:#00000012}
#bdots i.done{background:#bcd7f2}
#bpick{display:flex;gap:40px}
#bpick button{width:min(260px,36vw);height:min(260px,36vw);border-radius:40px;background:var(--card);box-shadow:0 8px 24px #0001;padding:20px}
#bpick svg{width:100%;height:100%}
.petal{transition-property:transform;transition-timing-function:ease-in-out;transform-box:view-box}

/* parent */
#parent{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:24px;-webkit-user-select:text;user-select:text}
#parent .wrap{width:min(860px,94vw);display:flex;flex-direction:column;gap:18px;padding-bottom:60px}
#parent h1{font-size:30px;margin:6px 0 0}
#parent .card{padding:22px 26px}
#parent h3{margin:0 0 12px;font-size:20px}
.seg{display:flex;flex-wrap:wrap;gap:10px}
.seg button{padding:14px 22px;border-radius:16px;background:#f1f1f6;font-size:18px;font-weight:700}
.seg button.sel{background:#bfe3cf}
.gamecard{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:center}
.gamecard .ic{width:64px;height:64px;grid-row:span 3}
.lv{display:flex;gap:6px}.lv i{width:22px;height:10px;border-radius:5px;background:#e8e8ef}.lv i.on{background:#9ccfb1}
.muted{color:var(--soft);font-size:16px}
.spark{display:flex;gap:6px;align-items:flex-end;height:46px}
.spark div{width:26px;background:#cfe5fb;border-radius:6px 6px 2px 2px;position:relative}
.spark div span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--soft)}
details{margin-top:14px}summary{font-weight:700;cursor:pointer;font-size:17px}
details p{line-height:1.5;font-size:16px;margin:8px 0 0}
.danger{background:#fbd3df!important}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* ---- phones ---- */
.endcard>svg{width:min(200px,26vh);height:min(200px,26vh)}
.endcard .pill svg{width:44px;height:44px}
#counting,#colours{padding-top:96px}
.choice{width:clamp(76px,min(15vw,20vh),160px);height:clamp(76px,min(15vw,20vh),160px);font-size:clamp(44px,min(9vw,12vh),92px)}
.cobj{width:clamp(80px,min(18vw,24vh),190px);height:clamp(92px,min(21vw,28vh),220px)}
@media (orientation:portrait) and (max-width:600px){
  #home .tiles{width:88vw;gap:16px}
  .tile{flex-direction:row;padding:14px 22px;gap:18px;border-radius:28px}
  .tile svg{width:min(120px,16vh);height:min(120px,16vh)}
  .tile span{font-size:26px}
  #dotcard{height:30vh}
  .choices{gap:14px}
  .cobj{width:38vw;height:min(44vw,24vh)}
  #colchoices{gap:10px 14px}
  .endcard{padding:30px 26px}
  #bpick{gap:20px}
}
@media (max-height:500px){
  .iconbtn{width:56px;height:56px}.iconbtn svg{width:30px;height:30px}
  #lockbtn .ring{width:68px;height:68px}
  .topbar{top:8px;left:10px;right:10px}
  .progress{top:28px}
  #counting,#colours{padding-top:20px}
  .stage{gap:3vh}
  #dotcard{height:40vh;width:min(560px,70vw)}
  #colchoices{flex-wrap:nowrap}
  .cobj{width:min(14vw,32vh);height:min(16vw,38vh)}
  .tile{padding:16px 10px 12px;gap:6px}.tile span{font-size:22px}
  .endcard{padding:20px 40px;gap:10px}.endcard h2{font-size:30px}
  .pill{padding:12px 36px}
  #bwrap{height:62vh}
}
</style>
</head>
<body>

<!-- START -->
<section class="screen on" id="start">
  <button class="bigplay" id="startbtn" aria-label="Start">
    <svg viewBox="0 0 100 100" width="110" height="110"><path d="M36 24 L78 50 L36 76 Z" fill="#fff" stroke="#fff" stroke-width="8" stroke-linejoin="round"/></svg>
  </button>
  <h1 id="starttitle">Mängime!</h1>
  <p id="startsub">Puuduta, et alustada</p>
</section>

<!-- HOME -->
<section class="screen" id="home">
  <div class="topbar">
    <div></div>
    <button class="iconbtn" id="lockbtn" aria-label="Parent area">
      <svg class="ring" viewBox="0 0 84 84"><circle cx="42" cy="42" r="39"/></svg>
      <svg viewBox="0 0 40 40"><rect x="9" y="18" width="22" height="16" rx="4" fill="#c7c7d6"/><path d="M14 18v-4a6 6 0 0 1 12 0v4" fill="none" stroke="#c7c7d6" stroke-width="3.4"/></svg>
      <div class="holdtip" id="holdtip"></div>
    </button>
  </div>
  <div class="tiles">
    <button class="tile t1" data-game="counting">
      <svg viewBox="0 0 120 120"><rect x="14" y="20" width="92" height="80" rx="20" fill="#fff"/><circle cx="40" cy="45" r="10" fill="#7fb3e8"/><circle cx="80" cy="45" r="10" fill="#f3a6b9"/><circle cx="60" cy="75" r="10" fill="#8fd1ad"/></svg>
      <span data-t="counting"></span>
    </button>
    <button class="tile t2" data-game="colours">
      <svg viewBox="0 0 120 120"><path d="M60 14c-26 0-46 18-46 42 0 20 16 30 28 26 8-3 12 2 10 10-2 10 6 16 16 14 22-4 38-24 38-48 0-26-20-44-46-44z" fill="#fff"/><circle cx="40" cy="46" r="9" fill="#ef8a8a"/><circle cx="62" cy="34" r="9" fill="#f6cf62"/><circle cx="84" cy="48" r="9" fill="#7fb3e8"/><circle cx="80" cy="74" r="9" fill="#8fd1ad"/></svg>
      <span data-t="colours"></span>
    </button>
    <button class="tile t3" data-game="breathing">
      <svg viewBox="0 0 120 120"><ellipse cx="60" cy="50" rx="30" ry="36" fill="#fff"/><path d="M56 86l4 6 4-6z" fill="#fff"/><path d="M60 92c-6 8 6 12 0 22" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><ellipse cx="50" cy="38" rx="6" ry="10" fill="#e9f6ee" transform="rotate(-20 50 38)"/></svg>
      <span data-t="breathing"></span>
    </button>
  </div>
</section>

<!-- COUNTING -->
<section class="screen" id="counting">
  <div class="topbar">
    <button class="iconbtn homebtn" aria-label="Home"><svg viewBox="0 0 40 40"><path d="M8 20 L20 9 L32 20 M12 17v14h16V17" fill="none" stroke="#8a8aa6" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="iconbtn sayagain" aria-label="Say again"><svg viewBox="0 0 40 40"><path d="M8 16h6l8-7v22l-8-7H8z" fill="#8a8aa6"/><path d="M27 14c3 3 3 9 0 12M31 10c5 5 5 15 0 20" fill="none" stroke="#8a8aa6" stroke-width="3" stroke-linecap="round"/></svg></button>
  </div>
  <div class="progress" id="cprog"></div>
  <div class="stage">
    <svg class="card" id="dotcard" viewBox="0 0 640 340"></svg>
    <div class="choices" id="numchoices"></div>
  </div>
</section>

<!-- COLOURS -->
<section class="screen" id="colours">
  <div class="topbar">
    <button class="iconbtn homebtn" aria-label="Home"><svg viewBox="0 0 40 40"><path d="M8 20 L20 9 L32 20 M12 17v14h16V17" fill="none" stroke="#8a8aa6" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="iconbtn sayagain" aria-label="Say again"><svg viewBox="0 0 40 40"><path d="M8 16h6l8-7v22l-8-7H8z" fill="#8a8aa6"/><path d="M27 14c3 3 3 9 0 12M31 10c5 5 5 15 0 20" fill="none" stroke="#8a8aa6" stroke-width="3" stroke-linecap="round"/></svg></button>
  </div>
  <div class="progress" id="kprog"></div>
  <div class="stage"><div class="choices" id="colchoices"></div></div>
</section>

<!-- BREATHING -->
<section class="screen" id="breathe">
  <div class="topbar">
    <button class="iconbtn homebtn" aria-label="Home"><svg viewBox="0 0 40 40"><path d="M8 20 L20 9 L32 20 M12 17v14h16V17" fill="none" stroke="#8a8aa6" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div></div>
  </div>
  <div id="bpick">
    <button data-k="balloon" aria-label="Balloon"></button>
    <button data-k="flower" aria-label="Flower"></button>
  </div>
  <div id="brun" style="display:none;flex-direction:column;align-items:center;gap:2vh">
    <div id="bwrap"></div>
    <div id="bword"></div>
    <div id="bdots"></div>
  </div>
</section>

<!-- DONE -->
<section class="screen" id="done">
  <div class="card endcard">
    <svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="46" fill="#ffe08a"/><g stroke="#ffd36e" stroke-width="10" stroke-linecap="round"><path d="M100 22v18M100 160v18M22 100h18M160 100h18M45 45l13 13M142 142l13 13M45 155l13-13M142 58l13-13"/></g><circle cx="86" cy="94" r="5" fill="#6b6b90"/><circle cx="114" cy="94" r="5" fill="#6b6b90"/><path d="M84 112q16 14 32 0" fill="none" stroke="#6b6b90" stroke-width="5" stroke-linecap="round"/></svg>
    <h2 data-t="allDone"></h2>
    <button class="pill" id="donehome"><svg viewBox="0 0 40 40" width="44" height="44"><path d="M8 20 L20 9 L32 20 M12 17v14h16V17" fill="none" stroke="#4a4a68" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</section>

<!-- REST (time limit) -->
<section class="screen" id="rest" style="background:linear-gradient(180deg,#dfe4f7,#f3e8f3)">
  <div class="card endcard">
    <svg viewBox="0 0 200 200"><path d="M128 40a64 64 0 1 0 32 92 52 52 0 0 1-32-92z" fill="#ffe7a8"/><circle cx="150" cy="50" r="5" fill="#fff"/><circle cx="40" cy="40" r="4" fill="#fff"/><circle cx="170" cy="100" r="3" fill="#fff"/><path d="M88 110q8 6 16 0" fill="none" stroke="#6b6b90" stroke-width="4" stroke-linecap="round"/><path d="M76 96q5-4 10 0M100 96q5-4 10 0" fill="none" stroke="#6b6b90" stroke-width="4" stroke-linecap="round"/></svg>
    <h2 data-t="rest"></h2>
  </div>
  <div class="topbar" style="top:auto;bottom:14px"><div></div><button class="iconbtn" id="lockbtn2" aria-label="Parent area" style="position:relative">
      <svg class="ring" viewBox="0 0 84 84" style="position:absolute;inset:-6px;width:84px;height:84px;transform:rotate(-90deg)"><circle cx="42" cy="42" r="39" style="fill:none;stroke:#9ccfb1;stroke-width:6;stroke-linecap:round;stroke-dasharray:245;stroke-dashoffset:245"/></svg>
      <svg viewBox="0 0 40 40"><rect x="9" y="18" width="22" height="16" rx="4" fill="#c7c7d6"/><path d="M14 18v-4a6 6 0 0 1 12 0v4" fill="none" stroke="#c7c7d6" stroke-width="3.4"/></svg>
  </button></div>
</section>

<!-- PARENT -->
<section class="screen" id="parent"><div class="wrap" id="pwrap"></div></section>

/* ---------------- audio ---------------- */
let ctx=null, curSrc=null, speakToken=0;
const buffers={};
function unlockAudio(){
  try{
    if(!ctx){ ctx = new (window.AudioContext||window.webkitAudioContext)(); }
    if(ctx.state==='suspended') ctx.resume();
    const b=ctx.createBuffer(1,1,22050), s=ctx.createBufferSource(); s.buffer=b; s.connect(ctx.destination); s.start(0);
  }catch(e){}
  try{ if('speechSynthesis' in window){ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u);} }catch(e){}
}
function b64ToBuf(b){ const s=atob(b), a=new Uint8Array(s.length); for(let i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a.buffer; }
async function getBuf(lang,key){
  const id=lang+'_'+key; if(buffers[id]) return buffers[id];
  const b64=(AUDIO[lang]||{})[key]; if(!b64||!ctx) return null;
  buffers[id] = await new Promise((res)=>{ try{ ctx.decodeAudioData(b64ToBuf(b64), res, ()=>res(null)); }catch(e){res(null);} });
  return buffers[id];
}
function deviceVoice(lang){
  try{
    if(!('speechSynthesis' in window)) return null;
    const vs=speechSynthesis.getVoices(); const pref = lang==='et'?['et']:['en-GB','en-US','en'];
    for(const p of pref){ const v=vs.find(v=>v.lang && v.lang.replace('_','-').toLowerCase().startsWith(p.toLowerCase())); if(v) return v; }
  }catch(e){}
  return null;
}
try{ speechSynthesis.onvoiceschanged=()=>{}; speechSynthesis.getVoices(); }catch(e){}
function stopSpeech(){
  speakToken++;
  try{ if(curSrc){ curSrc.onended=null; curSrc.stop(); } }catch(e){} curSrc=null;
  try{ speechSynthesis.cancel(); }catch(e){}
}
function voicePref(){ const v=(S.voices||{})[S.lang]; return v || (S.lang==='et'?'built':'device'); }
function useDevice(){ return voicePref()!=='built' && !!deviceVoice(S.lang); }
// speak a phrase key; resolves when finished
async function say(key){
  stopSpeech(); const my=speakToken;
  const txt=(PHRASES[key]||[])[S.lang==='et'?0:1];
  if(useDevice() && txt){
    return new Promise(res=>{
      const u=new SpeechSynthesisUtterance(txt); u.voice=deviceVoice(S.lang); u.lang=u.voice.lang; u.rate=S.lang==='et'?0.85:0.9; u.pitch=1.1;
      let done=false; const fin=()=>{ if(!done){done=true;res();} };
      u.onend=fin; u.onerror=fin; setTimeout(fin, 600+txt.length*140);
      try{ speechSynthesis.speak(u); }catch(e){ fin(); }
    });
  }
  const buf=await getBuf(S.lang,key);
  if(!buf || my!==speakToken) return;
  return new Promise(res=>{
    const s=ctx.createBufferSource(); s.buffer=buf; s.connect(ctx.destination);
    s.onended=()=>{ if(curSrc===s) curSrc=null; res(); }; curSrc=s; s.start(0);
  });
}
// soft sound effects
function chime(kind){
  if(!ctx) return; try{
  const now=ctx.currentTime;
  const notes = kind==='good'?[659,784,988]:kind==='soft'?[392]:[523,659];
  notes.forEach((f,i)=>{ const o=ctx.createOscillator(), g=ctx.createGain(); o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0,now+i*.09); g.gain.linearRampToValueAtTime(kind==='soft'?.06:.12,now+i*.09+.02); g.gain.exponentialRampToValueAtTime(.0001,now+i*.09+.6);
    o.connect(g); g.connect(ctx.destination); o.start(now+i*.09); o.stop(now+i*.09+.7); });
  }catch(e){}
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

let current='start', active=null; // active game key while playing
function show(id){ $$('.screen').forEach(s=>s.classList.toggle('on', s.id===id)); current=id; }
let tickT=null, lastTick=0;
function startClock(g){ active=g; lastTick=Date.now(); }
function stopClock(){ tickClock(); active=null; }
function tickClock(){

}
setInterval(tickClock,1000);

function limitReached(){ const d=day(); return S.limit>0 && d.sec >= (S.limit + (d.extra||0))*60; }

function goHome(){

/* ---------------- praise ---------------- */
const PASTEL=['#ffc4a8','#a9d8bf','#b8d6f7','#d6c6f2','#ffe48a','#f7b7c8'];
let praiseN=0;
async function praise(extraKey){
  const k='praise'+(1+(praiseN++%5));
  const bub=$('#praisebub'); bub.textContent=(PHRASES[k]||['',''])[S.lang==='et'?0:1];
  const p=$('#praise'); p.classList.add('show');
  for(let i=0;i<14;i++){ const c=document.createElement('div'); c.className='conf';
    const a=Math.random()*Math.PI*2, r=160+Math.random()*180;
    c.style.cssText=`left:50%;top:50%;background:${PASTEL[i%6]};--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px;animation-delay:${Math.random()*.15}s`;
    p.appendChild(c); setTimeout(()=>c.remove(),1900); }

  await say(k);
  await sleep(350); p.classList.remove('show'); await sleep(250);

/* ---------------- adaptive question game engine ---------------- */
const ROUND_Q=10, ROUND_MS=150000; // 10 questions or 2.5 minutes
const Game = {
  g:null, n:0, startMs:0, streak:0, mistakes:0, hinted:false, busy:false, alive:false, token:0,
  start(g){ this.g=g; this.n=0; this.streak=0; this.startMs=Date.now(); this.alive=true; this.token++;
    gday(g).rounds++; S.games[g].rounds++; save(); startClock(g);
    show(g==='counting'?'counting':'colours'); this.dots(); this.next(); },
  abort(){ this.alive=false; this.token++; },
  dots(){ const el=$(this.g==='counting'?'#cprog':'#kprog'); el.innerHTML=''; for(let i=0;i<ROUND_Q;i++) el.appendChild(document.createElement('i')); },
  next(){
    if(!this.alive) return;
    if(this.n>=ROUND_Q || Date.now()-this.startMs>ROUND_MS || limitReached()){ this.finish(); return; }
    this.mistakes=0; this.hinted=false; this.busy=false;
    (this.g==='counting'?Counting:Colours).build(S.games[this.g].level);
  },
  async answer(ok, el){
    if(this.busy||!this.alive) return; const my=this.token; const g=this.g, st=S.games[g];
    if(ok){
      this.busy=true; el.classList.add('good');
      const gd=gday(g); gd.q++; if(this.mistakes===0){ gd.first++; this.streak++; } else this.streak=0;
      if(this.streak>=3 && st.level<6){ st.level++; gd.ups++; this.streak=0; }
      save();
      const prog=$(g==='counting'?'#cprog':'#kprog').children[this.n]; if(prog) prog.classList.add('done');
      this.n++;
      await praise((g==='counting'?Counting:Colours).echo());
      if(my!==this.token) return; this.next();
    } else {
      this.mistakes++; this.streak=0; chime('soft');
      el.classList.remove('wobble'); void el.offsetWidth; el.classList.add('wobble');
      if(this.mistakes>=2 && !this.hinted){
        this.hinted=true; this.busy=true;
        if(st.level>1){ st.level--; gday(g).downs++; save(); }
        await (g==='counting'?Counting:Colours).hint();
        if(my!==this.token) return; this.busy=false;
      } else if(this.mistakes===1){ el.classList.add('faded'); say('try_again'); }
    }
  },
  async finish(){ this.alive=false; stopClock(); show('done'); chime('good'); await say('round_done');
    if(limitReached()){ await sleep(1200); if(current==='done') goRest(); } }
};

const DICE = {1:[[0,0]],2:[[-1,-1],[1,1]],3:[[-1,-1],[0,0],[1,1]],4:[[-1,-1],[1,-1],[-1,1],[1,1]],5:[[-1,-1],[1,-1],[0,0],[-1,1],[1,1]]};
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const Counting = {
  n:0, last:0, positions:[],
  build(level){
    const L=CLEVELS[level-1]; let n; do{ n=1+rnd(L.max); }while(n===this.last && L.max>1); this.last=n; this.n=n;
    // positions
    const W=640,H=340; let pos=[];
    if(L.lay==='dice' && n<=5){ const s=70; pos=DICE[n].map(([a,b])=>[W/2+a*s,H/2+b*s]); }
    else if(L.lay==='frame' || (L.lay==='dice')){ // ten-frame: 2 rows of 5
      const s=96, x0=W/2-2*s, y0=n<=5?H/2:H/2-s/2;
      for(let i=0;i<n;i++) pos.push([x0+(i%5)*s, y0+Math.floor(i/5)*s]);
    } else { // scatter on jittered grid
      const cells=[]; for(let r=0;r<3;r++) for(let c=0;c<5;c++) cells.push([c,r]); shuffle(cells);
      pos=cells.slice(0,n).map(([c,r])=>[80+c*120+rnd(30)-15, 70+r*100+rnd(24)-12]);
    }

    const r = n<=3?40:n<=5?34:30;
    const col=DOTCOL[rnd(DOTCOL.length)], obj=L.obj&&Math.random()<.7 ? OBJS[rnd(OBJS.length)] : null;
    this.obj=!!obj;
    $('#dotcard').innerHTML = pos.map(([x,y])=> obj?obj(x,y,r,col):`<circle class="dot" cx="${x}" cy="${y}" r="${r}" fill="${col}"/>`).join('');

    const pool=[]; for(let i=1;i<=Math.max(L.max,L.ch);i++) if(i!==n) pool.push(i);
    if(L.near){ shuffle(pool).sort((a,b)=>Math.abs(a-n)-Math.abs(b-n)); } else shuffle(pool);
    for(const p of pool){ if(opts.size>=L.ch) break; opts.add(p); }

      b.onpointerdown=e=>{ e.preventDefault(); Game.answer(v===n,b); }; box.appendChild(b); });
    say(this.obj?'count_prompt_obj':'count_prompt');
  },
  prompt(){ say(this.obj?'count_prompt_obj':'count_prompt'); },
  echo(){ return 'n'+this.n; },
  async hint(){
    const my=Game.token;
    // keep the correct answer and at most one other
    const bs=$$('#numchoices .choice'); let kept=0;
    bs.forEach(b=>{ if(+b.dataset.v!==this.n){ if(kept<1 && !b.classList.contains('faded')){kept++;} else b.classList.add('faded'); } });

      if(my!==Game.token) return;
      dots[i].classList.add('lit');

    }

  }
};

  return `<svg viewBox="0 0 200 260" ${id?'id="bobj" style="transform:none"':''}><path d="M100 120 C100 170 96 210 100 255" stroke="#8fd1ad" stroke-width="8" fill="none" stroke-linecap="round"/><ellipse cx="72" cy="200" rx="26" ry="12" fill="#a9dcbf" transform="rotate(-30 72 200)"/><ellipse cx="128" cy="220" rx="26" ry="12" fill="#a9dcbf" transform="rotate(30 128 220)"/><g transform="translate(0,0)">${p}</g><circle cx="100" cy="100" r="22" fill="#ffe08a"/><circle cx="93" cy="97" r="3" fill="#6b6b90"/><circle cx="107" cy="97" r="3" fill="#6b6b90"/><path d="M94 106q6 5 12 0" fill="none" stroke="#6b6b90" stroke-width="2.5" stroke-linecap="round"/></svg>`; }
const Breath = {
  alive:false, token:0, kind:'balloon', done:0, total:0,
  open(){ this.abort(); show('breathe'); $('#bpick').style.display='flex'; $('#brun').style.display='none';
    const bs=$$('#bpick button'); bs[0].innerHTML=BALLOON('gpick').replace('id="bobj"',''); bs[1].innerHTML=flowerSVG(false);
    bs.forEach(b=>b.onclick=()=>this.start(b.dataset.k)); say('pick'); },
  abort(){ if(this.alive){ // left early
      const st=S.games.breathing; if(this.done < Math.ceil(this.total/2) && st.level>1){ st.level--; gday('breathing').downs++; save(); } }
    this.alive=false; this.token++; },
  set(scale, secs){
    if(this.kind==='balloon'){ const o=$('#bobj'); o.style.transitionDuration=secs+'s'; o.style.transform=`scale(${scale})`; }
    else { $$('#bwrap .petal').forEach(p=>{ p.style.transition=`transform ${secs}s ease-in-out`; p.style.transform=`rotate(${p.dataset.a}deg) scale(${scale})`; }); }
  },
  async start(kind){
    this.kind=kind; S.games.breathing.pick=kind; this.alive=true; const my=++this.token;
    const st=S.games.breathing; const [tin,th,tout,n]=BLEVELS[st.level-1]; this.total=n; this.done=0;
    gday('breathing').rounds++; st.rounds++; save(); startClock('breathing');
    $('#bpick').style.display='none'; $('#brun').style.display='flex';
    $('#bwrap').innerHTML = kind==='balloon'?BALLOON('grun'):flowerSVG(true);
    const small = kind==='balloon'?.5:.35, big = kind==='balloon'?1:1;
    $('#bdots').innerHTML=''; for(let i=0;i<n;i++) $('#bdots').appendChild(document.createElement('i'));
    const word=$('#bword'); word.textContent='';
    this.set(small,.01);
    await say('breathe_intro'); await sleep(700);
    for(let i=0;i<n;i++){
      if(my!==this.token) return;
      word.textContent=PHRASES.breathe_in[S.lang==='et'?0:1]; say('breathe_in'); this.set(big,tin); await sleep(tin*1000);
      if(my!==this.token) return;
      if(th>0){ word.textContent=PHRASES.breathe_hold[S.lang==='et'?0:1]; say('breathe_hold'); await sleep(th*1000); if(my!==this.token) return; }
      word.textContent=PHRASES.breathe_out[S.lang==='et'?0:1]; say('breathe_out'); this.set(small,tout); await sleep(tout*1000);
      this.done++; const d=$('#bdots').children[i]; if(d) d.classList.add('done');
      gday('breathing').q++; save();
    }
    if(my!==this.token) return;
    this.alive=false; word.textContent='';
    if(st.level<6){ st.level++; gday('breathing').ups++; } gday('breathing').first++; save();
    stopClock(); show('done'); chime('good'); await say('breathe_done');
    if(limitReached()){ await sleep(1200); if(current==='done') goRest(); }
  }
};

/* ---------------- parent hold (3 s) ---------------- */
function holdButton(btn, onDone){
  const ring=btn.querySelector('.ring circle'); let t0=0, raf=0;
  const tip=btn.querySelector('.holdtip');
  const step=()=>{ const p=Math.min(1,(Date.now()-t0)/3000); ring.style.strokeDashoffset=245*(1-p);
    if(p>=1){ end(); onDone(); return; } raf=requestAnimationFrame(step); };
  const end=()=>{ cancelAnimationFrame(raf); t0=0; ring.style.strokeDashoffset=245; if(tip) setTimeout(()=>tip.classList.remove('show'),1200); };
  btn.addEventListener('pointerdown',e=>{ e.preventDefault(); t0=Date.now(); if(tip) tip.classList.add('show'); raf=requestAnimationFrame(step); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,()=>{ if(t0) end(); }));
  btn.addEventListener('contextmenu',e=>e.preventDefault());
}

/* ---------------- parent area ---------------- */
const ICON = {counting:document.querySelector('.tile.t1 svg').outerHTML, colours:document.querySelector('.tile.t2 svg').outerHTML, breathing:document.querySelector('.tile.t3 svg').outerHTML};
const TILEBG={counting:'var(--sky)',colours:'var(--rose)',breathing:'var(--mint)'};
function last7(){ const out=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i);
  const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); out.push([k,d]); } return out; }
let confirmReset=false;
function renderParent(){
  const d=day(), mins=Math.round(d.sec/60), lim=S.limit;
  const wd = S.lang==='et'?['P','E','T','K','N','R','L']:['S','M','T','W','T','F','S'];
  let h=`<div class="row"><h1>${t('parent')}</h1><button class="pill" id="pback">${t('back')}</button></div>`;
  h+=`<div class="card"><h3>${t('language')}</h3><div class="seg" id="plang">
      <button data-v="et" class="${S.lang==='et'?'sel':''}">Eesti</button><button data-v="en" class="${S.lang==='en'?'sel':''}">English</button></div>
      <div class="seg" id="pvoice" style="margin-top:12px">
      <button data-v="device" class="${voicePref()!=='built'?'sel':''}">${t('voiceDevice')}</button><button data-v="built" class="${voicePref()==='built'?'sel':''}">${t('voiceBuilt')}</button>
      <button id="ptest">🔊 ${t('test')}</button></div>
      <p class="muted" id="pvnote"></p></div>`;
  h+=`<div class="card"><h3>${t('limit')}</h3><div class="seg" id="plimit">${[0,10,15,20,30,45].map(v=>`<button data-v="${v}" class="${lim===v?'sel':''}">${v?v+' '+t('min'):t('off')}</button>`).join('')}</div>
      <p class="muted">${t('todayPlayed')}: ${mins} ${t('min')}${lim?` · ${Math.max(0,lim+(d.extra||0)-mins)} ${t('min')} ${t('left')}`:''}</p>
      ${lim&&limitReached()?`<div class="seg"><button id="pextend">${t('extend')}</button></div>`:''}</div>`;
  h+=`<h3 style="margin:8px 4px 0">${t('progress')}</h3>`;
  for(const g of GAMES){
    const st=S.games[g]; const days=last7();
    let bars='', any=false;
    for(const [k,dt] of days){ const x=(S.days[k]||{g:{}}).g[g];
      let v=0,label='';
      if(g==='breathing'){ v=x?x.rounds:0; label=v?v:''; any=any||v>0; bars+=`<div style="height:${Math.min(46,4+v*12)}px;background:${v?'#bfe3cf':'#eee'}" title="${v}"><span>${wd[dt.getDay()]}</span></div>`; }
      else { if(x&&x.q){ v=Math.round(100*x.first/x.q); any=true; } bars+=`<div style="height:${x&&x.q?Math.max(6,v*.46):4}px;background:${x&&x.q?'#cfe5fb':'#eee'}" title="${x&&x.q?v+'%':''}"><span>${wd[dt.getDay()]}</span></div>`; }
    }
    const tot7 = days.reduce((a,[k])=>{const x=(S.days[k]||{g:{}}).g[g]; if(x){a.q+=x.q;a.f+=x.first;a.m+=x.sec;} return a;},{q:0,f:0,m:0});
    const summary = g==='breathing' ? '' : (tot7.q? ` · ${Math.round(100*tot7.f/tot7.q)}%` : '');
    h+=`<div class="card"><div class="gamecard"><div class="ic" style="background:${TILEBG[g]};border-radius:18px;padding:6px">${ICON[g]}</div>
      <div class="row"><b style="font-size:20px">${t(g)}</b><span class="muted">${st.rounds} ${t('rounds')} · ${Math.round(tot7.m/60)} ${t('min')} / 7 d</span></div>
      <div class="row"><span class="lv">${[1,2,3,4,5,6].map(i=>`<i class="${i<=st.level?'on':''}"></i>`).join('')}</span><span class="muted">${t('level')} ${st.level}/6</span></div>
      <div><div class="muted" style="margin-bottom:6px">${g==='breathing'?t('breaths'):t('firstTry')}${summary}</div>
      ${any?`<div class="spark">${bars}</div><div style="height:20px"></div>`:`<div class="muted">${t('nodata')}</div>`}</div></div>
      <details><summary>${t('why')}</summary><p>${t(g==='counting'?'whyC':g==='colours'?'whyK':'whyB')}</p></details></div>`;
  }
  h+=`<div class="card"><p class="muted" style="margin:0 0 14px">${t('privacy')}</p><div class="seg">${confirmReset?
      `<span style="align-self:center;margin-right:8px">${t('sure')}</span><button class="danger" id="pyes">${t('yes')}</button><button id="pno">${t('no')}</button>`:
      `<button class="danger" id="preset">${t('reset')}</button>`}</div></div>`;
  $('#pwrap').innerHTML=h;
  $('#pback').onclick=()=>{ confirmReset=false; goHome(); };
  $$('#plang button').forEach(b=>b.onclick=()=>{ S.lang=b.dataset.v; save(); applyText(); renderParent(); say('welcome'); });
  $$('#pvoice button[data-v]').forEach(b=>b.onclick=()=>{ S.voices=Object.assign({},S.voices||{}); S.voices[S.lang]=b.dataset.v; save(); renderParent(); say('welcome'); });
  $('#ptest').onclick=()=>say('welcome');
  const dv=deviceVoice(S.lang);
  $('#pvnote').textContent = (voicePref()==='built') ? (S.lang==='et'?'Kasutan sisseehitatud eestikeelset häält.':'Using the built-in voice.') : dv ? `${t('voiceDevice')}: ${dv.name}` : (S.lang==='et'?'Selles seadmes pole eestikeelset häält, kasutan sisseehitatud häält.':'No device voice for this language, using the built-in voice.');
  $$('#plimit button').forEach(b=>b.onclick=()=>{ S.limit=+b.dataset.v; save(); renderParent(); });
  const ex=$('#pextend'); if(ex) ex.onclick=()=>{ const d=day(); d.extra=(d.extra||0)+10; save(); renderParent(); };
  const r=$('#preset'); if(r) r.onclick=()=>{ confirmReset=true; renderParent(); };
  const y=$('#pyes'); if(y) y.onclick=()=>{ const lang=S.lang, lim=S.limit, v=S.voices; S=freshState(); S.lang=lang; S.limit=lim; S.voices=v; save(); confirmReset=false; renderParent(); };
  const n=$('#pno'); if(n) n.onclick=()=>{ confirmReset=false; renderParent(); };
}
function openParent(){ stopSpeech(); stopClock(); Game.abort(); Breath.abort(); confirmReset=false; renderParent(); show('parent'); $('#parent').scrollTop=0; }

/* ---------------- wiring ---------------- */
applyText();
$('#startbtn').addEventListener('click',()=>{ unlockAudio(); try{ document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){}
  if(limitReached()){ goRest(); return; } show('home'); say('welcome'); });
$$('.tile').forEach(b=>b.addEventListener('click',async()=>{
  if(limitReached()){ goRest(); return; }
  const g=b.dataset.game; unlockAudio();
  if(g==='breathing'){ Breath.open(); }
  else { await say('g_'+g); Game.start(g); }
}));
$$('.homebtn').forEach(b=>b.addEventListener('click',goHome));
$('#donehome').addEventListener('click',goHome);
$$('.sayagain').forEach(b=>b.addEventListener('click',()=>{ if(Game.g==='counting') Counting.prompt(); else Colours.prompt(); }));
holdButton($('#lockbtn'), openParent);
holdButton($('#lockbtn2'), openParent);
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
</script>
